<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">

    <title>Sonic The Hedgehog - Kubo Touch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
        }

        .badge {
            background: #1a4dcc;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .game-card {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 20px #0008;
        }

        .cover-container {
            width: 100%;
            height: 260px;
            background: #000 url("sonic-cover.jpg") center / contain no-repeat;
        }

        .content {
            padding: 20px;
        }

        h1 {
            margin-top: 0;
            color: #3388ff;
            font-size: 25px;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            color: #aaa;
            font-size: 12px;
        }

        .description, .details {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        .details {
            margin-bottom: 20px;
        }

        .btn-play {
            display: block;
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #1a4dcc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-play:hover {
            background: #123599;
        }

        #game-container {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #game-container.active {
            display: block;
        }

        #status {
            margin-top: 12px;
            color: #ffcc66;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .cover-container {
                height: 220px;
            }
            .content {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <span class="badge">KUBO TOUCH</span>
    </header>

    <main class="game-card" id="game-card">
        <div class="cover-container"></div>

        <div class="content">
            <h1>Sonic The Hedgehog</h1>

            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1991</span>
                <span>🕹️ SEGA / Mega Drive</span>
            </div>

            <p class="description">
                Corra em alta velocidade por loops e obstáculos para salvar os animais das garras do Dr. Robotnik!
            </p>

            <div class="details">
                <ul>
                    <li><strong>🔥 Curiosidade:</strong> Sonic tornou-se um dos maiores ícones da SEGA.</li>
                    <li><strong>⚡ Gênero:</strong> Plataforma / Ação</li>
                </ul>
            </div>

            <button class="btn-play" id="play-button" onclick="startGame()">
                JOGAR AGORA
            </button>

            <div id="status" role="status"></div>
        </div>
    </main>

    <div id="game-container"></div>

   <script>
    async function startGame() {
        const card = document.getElementById("game-card");
        const container = document.getElementById("game-container");
        const status = document.getElementById("status");
        const btn = document.getElementById("play-button");

        const romUrl = new URL("sonic1.gen", location.href).href;

        // 1) Testa se a ROM existe antes de abrir o emulador
        btn.disabled = true;
        status.textContent = "Verificando a ROM...";
        try {
            const r = await fetch(romUrl, { method: "HEAD" });
            if (!r.ok) throw new Error("ROM não encontrada (HTTP " + r.status + ")");
        } catch (e) {
            status.textContent = "Erro: " + e.message +
                ". Abra pelo GitHub Pages ou por um servidor local (não por file://).";
            btn.disabled = false;
            return;
        }

        // 2) Só agora mostra o emulador
        card.style.display = "none";
        container.classList.add("active");
        container.innerHTML = "";

        window.EJS_player = "#game-container";
        window.EJS_core = "segaMD";
        window.EJS_gameUrl = romUrl;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_gameName = "Sonic The Hedgehog";
        window.EJS_language = "pt-BR";
        window.EJS_startOnLoaded = true;
        window.EJS_threads = false;
        window.EJS_onGameStart = () => console.log("Jogo iniciado");

        const old = document.getElementById("emulatorjs-loader");
        if (old) old.remove();

        const script = document.createElement("script");
        script.id = "emulatorjs-loader";
        script.src = window.EJS_pathtodata + "loader.js";
        script.onerror = () => {
            container.classList.remove("active");
            card.style.display = "";
            btn.disabled = false;
            status.textContent = "Não foi possível carregar o EmulatorJS (CDN bloqueado ou sem internet).";
        };
        document.body.appendChild(script);
    }
</script>

</body>
</html>
